org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# 需要 JDK 17（AGP 8.5 不支持更高版本）。
# 若本机 Android Studio 自带 JBR 是更高版本，请指定 JDK 17 的路径，
# 或在 Android Studio → Settings → Build Tools → Gradle → Gradle JDK 里选 JDK 17。
#org.gradle.java.home=C:/Program Files/Java/jdk-17

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=34

kotlin.code.style=official
