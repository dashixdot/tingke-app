<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>听课时间轴打标 · 原型 v1.1</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#1f2937; --sub:#6b7280;
    --brand:#2563eb; --brand-d:#1d4ed8; --line:#e5e7eb; --danger:#dc2626;
    --ok:#16a34a; --warn:#d97706; --q:#7c3aed;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);position:relative;}
  /* 顶部信息条 */
  .topbar{padding:12px 16px;background:var(--brand);color:#fff;}
  .topbar .ttl{font-size:17px;font-weight:700;}
  .topbar .meta{font-size:12px;opacity:.9;margin-top:3px;line-height:1.5;}
  .topbar .edit{float:right;font-size:12px;border:1px solid rgba(255,255,255,.6);
    border-radius:14px;padding:3px 10px;cursor:pointer;}
  /* 计时区 */
  .clock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
  .timer{font-size:64px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;}
  .timer.paused{color:var(--sub);}
  .state{font-size:14px;color:var(--sub);}
  .state.run{color:var(--ok);}
  .state.pau{color:var(--warn);}
  .rec{display:none;align-items:center;gap:6px;color:var(--danger);font-size:14px;font-weight:600;}
  .rec .dot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}
  .pill{display:inline-block;padding:4px 12px;border-radius:14px;background:#eef2ff;color:var(--brand-d);font-size:13px;}
  /* 底部操作 */
  .bottom{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);}
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn.sec{background:#eef2ff;color:var(--brand-d);}
  .btn.ghost{background:#f3f4f6;color:var(--sub);}
  .btn.primary{flex:2;background:var(--brand);color:#fff;font-size:18px;padding:18px;}
  .btn.end{background:#fef2f2;color:var(--danger);}
  .btn:active{transform:scale(.98);}
  /* 时间轴页 */
  .page{padding:14px 16px 110px;}
  .empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;}
  .item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:58px;color:var(--brand-d);}
  .body{flex:1;}
  .lab{display:inline-block;padding:2px 10px;border-radius:10px;color:#fff;font-size:13px;font-weight:600;}
  .ev{font-size:12px;margin-left:6px;}
  .ev.ok{color:var(--ok);} .ev.wa{color:var(--warn);} .ev.qu{color:var(--q);}
  .dur{font-size:12px;color:var(--brand-d);background:#eef2ff;border-radius:8px;padding:1px 8px;margin-left:6px;font-variant-numeric:tabular-nums;}
  .note{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5;}
  .del{color:var(--danger);font-size:13px;cursor:pointer;padding:4px 8px;}
  /* 弹窗通用 */
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;
    align-items:flex-end;justify-content:center;}
  .mask.show{display:flex;}
  .sheet{width:100%;max-width:480px;background:var(--card);border-radius:18px 18px 0 0;
    max-height:88vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom));}
  .sheet h3{margin:0 0 4px;font-size:17px;}
  .sheet .hint{font-size:12px;color:var(--sub);margin-bottom:12px;}
  .closeX{float:right;color:var(--sub);font-size:22px;cursor:pointer;margin-top:-4px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .chip{padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:#fff;
    font-size:13px;text-align:center;cursor:pointer;}
  .chip.on{border-color:var(--brand);background:#eef2ff;color:var(--brand-d);font-weight:600;}
  .chip.sm{font-size:12px;padding:8px 4px;}
  .seg{display:flex;gap:8px;margin-bottom:14px;}
  .sub-lbl{font-size:12px;color:var(--sub);margin:6px 0 6px;}
  .field{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;
    resize:none;margin-bottom:14px;font-family:inherit;}
  .save{width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;}
  .save:disabled{background:#cbd5e1;}
  /* 报告页 */
  .report{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;line-height:1.6;padding:14px;border-radius:12px;max-height:46vh;overflow:auto;}
  .tab{display:flex;gap:8px;margin-bottom:12px;}
  .tab .tbtn{flex:1;text-align:center;padding:9px;border-radius:10px;background:#eef2ff;color:var(--brand-d);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .tab .tbtn.on{background:var(--brand);color:#fff;}
  .srow{margin-bottom:12px;}
  .shead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .shead b{font-weight:700;}
  .sbar{height:14px;background:#eef2f1;border-radius:7px;overflow:hidden;}
  .sfill{height:100%;border-radius:7px;}
  .toast{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:rgba(0,0,0,.8);
    color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;display:none;z-index:40;max-width:80%;text-align:center;}
  audio{background:#fff;border-radius:10px;}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 顶部 -->
  <div class="topbar" id="topbar">
    <span class="edit" onclick="openInfo()">编辑信息</span>
    <div class="ttl" id="ttl">未开始听课</div>
    <div class="meta" id="meta">点击「开始」进入听课计时</div>
  </div>

  <!-- 听课页（计时） -->
  <div class="clock" id="clockView">
    <div class="timer" id="timer">00:00</div>
    <div class="state" id="state">待开始</div>
    <div class="rec" id="recInd"><span class="dot"></span><span id="recTxt">录音 00:00</span></div>
  </div>

  <!-- 时间轴页 -->
  <div class="page" id="axisView" style="display:none">
    <div id="axisList"></div>
    <div class="empty" id="axisEmpty">还没有打标。返回听课页，点底部「打标」记录第一个环节。</div>
  </div>

  <!-- 报告页 -->
  <div class="page" id="reportView" style="display:none">
    <audio id="audioPlay" controls style="width:100%;margin-bottom:10px;display:none"></audio>
    <a id="audioDl" download style="display:none;font-size:13px;color:var(--brand-d);margin-bottom:10px;display:none">⬇ 下载录音</a>
    <div id="audioNote" style="display:none;font-size:12px;color:var(--sub);margin-bottom:8px"></div>
    <div class="tab">
      <div class="tbtn on" onclick="setRep('txt')">文本时间轴</div>
      <div class="tbtn" onclick="setRep('csv')">CSV</div>
      <div class="tbtn" onclick="setRep('share')">环节占比</div>
    </div>
    <div class="report" id="reportBox"></div>
    <div id="shareBox" style="display:none"></div>
  </div>

  <!-- 底部 -->
  <div class="bottom" id="bottomBar">
    <div class="row">
      <button class="btn ghost" onclick="goAxis()">时间轴 <span id="cntBadge"></span></button>
      <button class="btn sec" id="recBtn" onclick="toggleRec()" style="display:none">🎙 录音</button>
      <button class="btn sec" id="pauseBtn" onclick="togglePause()" style="display:none">暂停</button>
    </div>
    <div class="row">
      <button class="btn primary" id="mainBtn" onclick="startOrTag()">开始听课</button>
      <button class="btn end" id="endBtn" onclick="endSession()" style="display:none">结束</button>
    </div>
  </div>

  <!-- 打标弹窗 -->
  <div class="mask" id="tagMask">
    <div class="sheet">
      <span class="closeX" onclick="closeTag()">×</span>
      <h3>课堂环节打标</h3>
      <div class="hint" id="tagTime">当前时间：00:00</div>
      <div class="sub-lbl">① 选择环节（必选）</div>
      <div class="grid" id="labelGrid"></div>
      <div id="subWrap" style="display:none">
        <div class="sub-lbl">② 子标签（可选）</div>
        <div class="grid" id="subGrid"></div>
      </div>
      <div class="sub-lbl">③ 评课标记（可选）</div>
      <div class="seg" id="evalSeg">
        <div class="chip sm" data-ev="">无</div>
        <div class="chip sm" data-ev="亮点">⭐ 亮点</div>
        <div class="chip sm" data-ev="不足">⚠️ 不足</div>
        <div class="chip sm" data-ev="疑问">❓ 疑问</div>
      </div>
      <div class="sub-lbl">④ 备注（可选）</div>
      <textarea class="field" id="tagNote" rows="2" placeholder="例如：激光笔+水槽演示折射，直观"></textarea>
      <button class="save" id="saveTag" disabled onclick="saveTag()">保存这条打标</button>
    </div>
  </div>

  <!-- 信息编辑弹窗 -->
  <div class="mask" id="infoMask">
    <div class="sheet">
      <span class="closeX" onclick="closeInfo()">×</span>
      <h3>听课信息</h3>
      <div class="sub-lbl">课题</div>
      <input class="field" id="iTitle" placeholder="如：光的折射">
      <div class="sub-lbl">授课教师</div>
      <input class="field" id="iTeacher" placeholder="如：张老师">
      <div class="sub-lbl">班级</div>
      <input class="field" id="iClass" placeholder="如：高二(3)班">
      <div class="sub-lbl">听课人</div>
      <input class="field" id="iObserver" placeholder="如：李老师">
      <button class="save" onclick="saveInfo()">保存</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const LABELS = {
  "导入":["情境引入","复习引入","实验引入"],
  "目标呈现":["行为目标","核心素养目标"],
  "新授讲解":["概念建构","规律推导","公式教学"],
  "实验演示":["教师演示","现象展示"],
  "学生实验":["分组探究","动手操作","器材整理"],
  "探究活动":["提出问题","猜想假设","方案设计","实验验证","分析论证","成果展示"],
  "提问互动":["追问","学生汇报","师生对话","小组交流"],
  "当堂检测":["3–5分钟检测","预测单","随堂练习"],
  "巩固练习":["例题讲评","习题训练","变式拓展"],
  "小结":["学生小结","教师小结","知识结构"],
  "作业布置":["分层作业","挑战任务"],
  "板书板图":["板书画图","思维导图","知识网络"],
  "多媒体与信息技术":["AI工具","模拟动画","投屏展示"],
  "拓展延伸":["生活应用","学科前沿","价值引领"]
};
const COLORS = ["#2563eb","#0891b2","#7c3aed","#db2777","#dc2626","#ea580c","#d97706","#16a34a","#15803d","#0d9488","#4f46e5","#9333ea","#c026d3","#e11d48"];
const colorOf = k => COLORS[Object.keys(LABELS).indexOf(k) % COLORS.length];

let S = { running:false, paused:false, elapsed:0, timer:null,
  info:{title:"",teacher:"",cls:"",obs:""}, marks:[], curLabel:"", curSub:"", curEval:"" };

/* 录音状态（原型：真实 MediaRecorder + 无麦克风时模拟） */
let rec = { active:false, sim:false, chunks:[], mr:null, stream:null, startTs:0, blob:null, blobUrl:null };

/* 持久化（录音为二进制，不持久化） */
function load(){ try{ const r=localStorage.getItem("tingke_v1"); if(r){ const o=JSON.parse(r); S.info=o.info||S.info; S.marks=o.marks||[]; S.elapsed=o.elapsed||0; S.running=!!o.running; S.paused=!!o.paused; } }catch(e){} }
function save(){ try{ localStorage.setItem("tingke_v1", JSON.stringify({info:S.info,marks:S.marks,elapsed:S.elapsed,running:S.running,paused:S.paused})); }catch(e){} }

function fmt(s){ s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60),ss=s%60; return String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0"); }
function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.style.display="block"; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display="none",1600); }

function tick(){ S.elapsed++; renderTimer(); if(document.getElementById("axisView").style.display!=="none") updateAxisDurations(); if(rec.active) renderRec(); }
function renderTimer(){ document.getElementById("timer").textContent=fmt(S.elapsed); }

function startOrTag(){
  if(!S.running){ startSession(); }
  else { openTag(); }
}
function startSession(){
  S.running=true; S.paused=false; S.elapsed=0; S.marks=[];
  S.timer=setInterval(tick,1000);
  refreshUI(); save();
  toast("已开始计时，点「打标」记录环节");
}
function togglePause(){
  if(!S.running) return;
  if(S.paused){
    S.paused=false; S.timer=setInterval(tick,1000);
    document.getElementById("state").textContent="听课中…"; document.getElementById("state").className="state run"; document.getElementById("pauseBtn").textContent="暂停";
    if(rec.active && rec.mr && rec.mr.state==="paused") rec.mr.resume();
  } else {
    S.paused=true; clearInterval(S.timer);
    document.getElementById("state").textContent="已暂停"; document.getElementById("state").className="state pau"; document.getElementById("pauseBtn").textContent="继续";
    if(rec.active && rec.mr && rec.mr.state==="recording") rec.mr.pause();
  }
  save();
}
function endSession(){
  clearInterval(S.timer); S.running=false; S.paused=false;
  stopRec(true);
  goReport(); save();
  toast("已生成时间轴报告");
}

/* ===== 录音 ===== */
async function toggleRec(){
  if(!S.running){ toast("请先开始听课"); return; }
  if(!rec.active) await startRec(); else stopRec(false);
}
async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec.stream=stream; rec.chunks=[]; rec.sim=false; rec.startTs=S.elapsed;
    rec.mr=new MediaRecorder(stream);
    rec.mr.ondataavailable=e=>{ if(e.data && e.data.size) rec.chunks.push(e.data); };
    rec.mr.onstop=()=>{ try{ rec.blob=new Blob(rec.chunks,{type:rec.mr.mimeType||"audio/webm"}); rec.blobUrl=URL.createObjectURL(rec.blob); }catch(e){} };
    rec.mr.start();
    rec.active=true; toast("开始录音");
  }catch(e){
    rec.sim=true; rec.active=true; rec.startTs=S.elapsed; toast("无麦克风权限，已切换为模拟录音");
  }
  renderRec(); refreshUI();
}
function stopRec(silent){
  if(!rec.active && !rec.mr) return;
  rec.active=false;
  if(rec.mr && rec.mr.state!=="inactive"){ try{ rec.mr.stop(); }catch(e){} }
  if(rec.stream){ rec.stream.getTracks().forEach(t=>t.stop()); rec.stream=null; }
  renderRec(); refreshUI();
  if(!silent && !rec.sim && rec.blobUrl) showAudio();
  if(!silent && rec.sim){ /* 模拟无文件 */ }
}
function renderRec(){
  const ind=document.getElementById("recInd");
  ind.style.display = rec.active ? "inline-flex" : "none";
  if(rec.active){
    const d = rec.sim ? (S.elapsed - rec.startTs) : (S.elapsed - rec.startTs);
    document.getElementById("recTxt").textContent = "录音 " + fmt(d);
  }
  const b=document.getElementById("recBtn");
  if(S.running){ b.style.display="block"; b.textContent = rec.active ? "⏹ 停止" : "🎙 录音"; }
  else b.style.display="none";
}
function showAudio(){
  const a=document.getElementById("audioPlay"), dl=document.getElementById("audioDl"), note=document.getElementById("audioNote");
  if(rec.sim){ note.textContent="（本环境无麦克风权限，本次为模拟录音，未生成音频文件）"; note.style.display="block"; a.style.display="none"; dl.style.display="none"; return; }
  if(rec.blobUrl){ a.src=rec.blobUrl; a.style.display="block"; dl.href=rec.blobUrl; dl.download=(S.info.title||"听课")+"-录音.webm"; dl.style.display="inline-block"; note.style.display="none"; }
}

/* 视图切换 */
function goAxis(){ document.getElementById("clockView").style.display="none"; document.getElementById("axisView").style.display="block"; document.getElementById("reportView").style.display="none"; renderAxis(); }
function goClock(){ document.getElementById("clockView").style.display="flex"; document.getElementById("axisView").style.display="none"; document.getElementById("reportView").style.display="none"; }
function goReport(){ document.getElementById("clockView").style.display="none"; document.getElementById("axisView").style.display="none"; document.getElementById("reportView").style.display="block"; if(rec.blobUrl||rec.sim) showAudio(); renderReport(); }

function refreshUI(){
  const i=S.info;
  document.getElementById("ttl").textContent = i.title || (S.running?"听课进行中":"未开始听课");
  let meta=[i.teacher,i.cls,i.obs].filter(Boolean).join(" · ");
  if(rec.active) meta = (meta?meta+" · ":"") + "●录音中";
  if(!S.running) meta = meta || "点击「开始」进入听课计时";
  document.getElementById("meta").textContent = meta;
  const t=document.getElementById("timer"); t.textContent=fmt(S.elapsed);
  t.className="timer"+(S.paused?" paused":"");
  const st=document.getElementById("state");
  if(S.running){ st.textContent=S.paused?"已暂停":"听课中…"; st.className="state "+(S.paused?"pau":"run"); }
  else { st.textContent="待开始"; st.className="state"; }
  document.getElementById("mainBtn").textContent = S.running?"打标":"开始听课";
  document.getElementById("pauseBtn").style.display = S.running?"block":"none";
  document.getElementById("pauseBtn").textContent = S.paused?"继续":"暂停";
  document.getElementById("endBtn").style.display = S.running?"block":"none";
  const c=document.getElementById("cntBadge"); c.textContent = S.marks.length?("("+S.marks.length+")"):"";
  renderRec();
}

/* 打标弹窗 */
function openTag(){
  if(!S.running){ toast("请先开始听课"); return; }
  S.curLabel=""; S.curSub=""; S.curEval="";
  document.getElementById("tagTime").textContent="当前时间："+fmt(S.elapsed);
  const g=document.getElementById("labelGrid"); g.innerHTML="";
  Object.keys(LABELS).forEach(k=>{
    const d=document.createElement("div"); d.className="chip"; d.textContent=k;
    d.onclick=()=>{ S.curLabel=k; S.curSub=""; document.querySelectorAll("#labelGrid .chip").forEach(x=>x.classList.remove("on")); d.classList.add("on"); showSubs(k); updateSave(); };
    g.appendChild(d);
  });
  document.getElementById("subWrap").style.display="none";
  document.querySelectorAll("#evalSeg .chip").forEach(x=>x.classList.remove("on"));
  document.querySelector('#evalSeg .chip[data-ev=""]').classList.add("on");
  document.getElementById("tagNote").value="";
  document.getElementById("saveTag").disabled=true;
  document.getElementById("tagMask").classList.add("show");
}
function showSubs(k){
  const w=document.getElementById("subWrap"), g=document.getElementById("subGrid"); g.innerHTML="";
  if(LABELS[k] && LABELS[k].length){ w.style.display="block"; LABELS[k].forEach(s=>{ const d=document.createElement("div"); d.className="chip sm"; d.textContent=s; d.onclick=()=>{ S.curSub=s; document.querySelectorAll("#subGrid .chip").forEach(x=>x.classList.remove("on")); d.classList.add("on"); }; g.appendChild(d); }); }
  else w.style.display="none";
}
document.querySelectorAll("#evalSeg .chip").forEach(x=>{ x.onclick=()=>{ S.curEval=x.dataset.ev; document.querySelectorAll("#evalSeg .chip").forEach(c=>c.classList.remove("on")); x.classList.add("on"); }; });
function updateSave(){ document.getElementById("saveTag").disabled = !S.curLabel; }
function closeTag(){ document.getElementById("tagMask").classList.remove("show"); }
function saveTag(){
  if(!S.curLabel) return;
  S.marks.push({ ts:S.elapsed, label:S.curLabel, sub:S.curSub, eval:S.curEval, note:document.getElementById("tagNote").value.trim(), id:Date.now()+Math.random() });
  S.marks.sort((a,b)=>a.ts-b.ts);
  closeTag(); save(); refreshUI();
  toast("已记录："+S.curLabel+(S.curSub?"·"+S.curSub:""));
}

/* 时间轴 + 环节时长 */
function segDur(i){
  const cur=S.marks[i], nxt=S.marks[i+1];
  const end = nxt ? nxt.ts : S.elapsed;
  return Math.max(0, end - cur.ts);
}
function renderAxis(){
  const list=document.getElementById("axisList"), e=document.getElementById("axisEmpty");
  list.innerHTML=""; e.style.display = S.marks.length?"none":"block";
  S.marks.forEach(m=>{
    const evCls = m.eval==="亮点"?"ok":m.eval==="不足"?"wa":m.eval==="疑问"?"qu":"";
    const evTxt = m.eval?(" "+{亮点:"⭐",不足:"⚠️",疑问:"❓"}[m.eval]):"";
    const noteHtml = m.note ? '<div class="note">' + m.note.replace(/</g,"&lt;") + '</div>' : "";
    const idx = S.marks.indexOf(m);
    const div=document.createElement("div"); div.className="item";
    div.innerHTML = '<div class="t">' + fmt(m.ts) + '</div><div class="body">' +
      '<span class="lab" style="background:' + colorOf(m.label) + '">' + m.label + '</span>' +
      '<span class="ev ' + evCls + '">' + (m.sub?('·'+m.sub):"") + evTxt + '</span>' +
      '<span class="dur">时长 ' + fmt(segDur(idx)) + '</span>' +
      noteHtml +
      '</div><div class="del" onclick="delMark(' + m.id + ')">删除</div>';
    list.appendChild(div);
  });
  updateAxisDurations();
}
function updateAxisDurations(){
  const ds=document.querySelectorAll("#axisList .dur");
  ds.forEach((el,idx)=>{ if(S.marks[idx]) el.textContent="时长 "+fmt(segDur(idx)); });
}
function delMark(id){ S.marks=S.marks.filter(m=>m.id!==id); save(); refreshUI(); renderAxis(); }

/* 报告 */
let repMode="txt";
function setRep(m){
  repMode=m;
  document.querySelectorAll(".tab .tbtn").forEach((b,i)=>b.classList.toggle("on",(i===0?m==="txt":i===1?m==="csv":m==="share")));
  document.getElementById("reportBox").style.display = (m==="txt"||m==="csv")?"block":"none";
  document.getElementById("shareBox").style.display = (m==="share")?"block":"none";
  renderReport();
}
function renderReport(){
  const i=S.info;
  const head = `【${i.title||"未命名课题"}】${i.cls||""} ${i.teacher||""} ${new Date().toISOString().slice(0,10)} 时长 ${fmt(S.elapsed)}`;
  if(repMode==="txt"){
    let t=head+"\n";
    if(!S.marks.length) t+="（暂无打标记录）";
    S.marks.forEach((m,idx)=>{ t+=`\n${fmt(m.ts)} ${m.label}${m.sub?("·"+m.sub):""}${({亮点:" ⭐",不足:" ⚠️",疑问:" ❓"}[m.eval]||"")} 〔时长 ${fmt(segDur(idx))}〕${m.note?(" "+m.note):""}`; });
    document.getElementById("reportBox").textContent=t;
  } else if(repMode==="csv"){
    let t="时间(秒),时间,环节,子标签,评课标记,环节时长(秒),备注\n";
    S.marks.forEach((m,idx)=>{ t+=`${m.ts},${fmt(m.ts)},"${m.label}","${m.sub||""}","${m.eval||""}",${segDur(idx)},"${(m.note||"").replace(/"/g,'""')}"\n`; });
    document.getElementById("reportBox").textContent=t;
  } else {
    renderShare();
  }
}
function renderShare(){
  const total=S.elapsed||1;
  const map={};
  S.marks.forEach((m,i)=>{ map[m.label]=(map[m.label]||0)+segDur(i); });
  const box=document.getElementById("shareBox");
  if(!Object.keys(map).length){ box.innerHTML='<div class="empty">暂无打标记录，无法统计环节占比。</div>'; return; }
  const keys=Object.keys(map).sort((a,b)=>map[b]-map[a]);
  let html=`<div style="font-size:13px;color:var(--sub);margin-bottom:14px">总时长 ${fmt(S.elapsed)}，共 ${S.marks.length} 个环节标记，按主标签聚合占比：</div>`;
  keys.forEach(k=>{
    const d=map[k], p=(d/total*100).toFixed(1);
    html+=`<div class="srow">
      <div class="shead"><span><b style="color:${colorOf(k)}">${k}</b></span><span>${fmt(d)} · ${p}%</span></div>
      <div class="sbar"><div class="sfill" style="width:${p}%;background:${colorOf(k)}"></div></div>
    </div>`;
  });
  box.innerHTML=html;
}

/* 信息编辑 */
function openInfo(){ const i=S.info; document.getElementById("iTitle").value=i.title; document.getElementById("iTeacher").value=i.teacher; document.getElementById("iClass").value=i.cls; document.getElementById("iObserver").value=i.obs; document.getElementById("infoMask").classList.add("show"); }
function closeInfo(){ document.getElementById("infoMask").classList.remove("show"); }
function saveInfo(){ S.info={title:document.getElementById("iTitle").value.trim(),teacher:document.getElementById("iTeacher").value.trim(),cls:document.getElementById("iClass").value.trim(),obs:document.getElementById("iObserver").value.trim()}; closeInfo(); refreshUI(); save(); }

/* 复制导出 */
document.getElementById("reportBox").addEventListener("click",()=>{
  if(!S.marks.length) return;
  const txt=document.getElementById("reportBox").textContent;
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast("已复制到剪贴板")); }
  else toast("请手动选择复制");
});

load(); refreshUI();
if(S.running && !S.paused){ S.timer=setInterval(tick,1000); }
</script>
</body>
</html>
